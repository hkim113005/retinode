[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinode"
version = "0.0.1"
description = "An epiretinal electrode-geometry selectivity testbed"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hkim113005" }]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# The engine core is numpy/scipy only, so the pure library stays importable
# from a notebook or the test suite. Everything heavy is an opt-in extra,
# grouped by the phase/subsystem that needs it.
#
# NOTE: FEniCSx/DOLFINx is intentionally absent — it has no pip wheel, so the
# DOLFINx backend lives in a separate conda-forge env (env/fem-environment.yml),
# which runs *locally* on Apple Silicon (osx-arm64 build verified, 0.11.0) — see
# docs/phase-4-plan.md. NGSolve + gmsh below ship pip wheels, so the FEM
# cross-check backend and the mesh front-end can also run under uv.
cable = [
    "neuron",            # NEURON multi-compartment RGC population + threshold search
]
fem = [
    "ngsolve",           # open-source FEM cross-check backend (pip; universal2)
    "gmsh",              # shared mesh front-end for the FEM backends
]
app = [
    "dash",              # Phase-2 dashboard
    "plotly",            # field / activation / Pareto views
]
store = [
    "h5py",              # HDF5 transfer-matrix (A) cache
    "pyarrow",           # parquet result store
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",             # FastAPI's TestClient (starlette) needs it; also the API tests
]
dev = [
    "pytest",
    "hypothesis",     # property-based tests (physics invariants, canonicalization)
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running (NEURON threshold searches, FEM solves); excluded from the fast suite",
    "neuron: requires the NEURON cable engine (install the 'cable' extra)",
    "fem: requires a FEM backend (install the 'fem' extra)",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
