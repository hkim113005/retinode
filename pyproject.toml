[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinode"
version = "0.0.1"
description = "An epiretinal electrode-geometry selectivity testbed: score and compare electrode designs for RGC-population selectivity and safety."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hkim113005" }]
keywords = [
    "retinal-prosthesis",
    "epiretinal",
    "electrode-geometry",
    "neurostimulation",
    "NEURON",
    "finite-element",
    "computational-neuroscience",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Repository = "https://github.com/hkim113005/retinode"
Documentation = "https://github.com/hkim113005/retinode/blob/main/docs/user-guide.md"
Issues = "https://github.com/hkim113005/retinode/issues"

[project.optional-dependencies]
# The engine core is numpy/scipy only, so the pure library stays importable
# from a notebook or the test suite. Everything heavy is an opt-in extra,
# grouped by the phase/subsystem that needs it.
#
# NOTE: FEniCSx/DOLFINx is intentionally absent — it has no pip wheel, so the
# DOLFINx backend lives in a separate conda-forge env (env/fem-environment.yml),
# which runs *locally* on Apple Silicon (osx-arm64 build verified, 0.11.0) — see
# docs/phase-4-plan.md. NGSolve + gmsh below ship pip wheels, so the FEM
# cross-check backend and the mesh front-end can also run under uv.
cable = [
    "neuron",            # NEURON multi-compartment RGC population + threshold search
]
fem = [
    "ngsolve",           # open-source FEM cross-check backend (pip; universal2)
    "gmsh",              # shared mesh front-end for the FEM backends
]
store = [
    "h5py",              # HDF5 transfer-matrix (A) cache
    "pyarrow",           # parquet result store
]
api = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",             # FastAPI's TestClient (starlette) needs it; also the API tests
    "python-multipart",  # FastAPI UploadFile (the CAD upload endpoint) needs it
]
dev = [
    "pytest",
    "hypothesis",     # property-based tests (physics invariants, canonicalization)
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "app"]

# The sdist is an explicit allowlist — never a "everything not gitignored" sweep. That
# would ship the copyrighted PDFs in papers/ and dev cruft (.hypothesis, .github,
# .claude). Only the source needed to build, run, and understand the package ships.
[tool.hatch.build.targets.sdist]
include = [
    "engine/",
    "api/",
    "app/",
    "examples/",
    "docs/",
    "env/",
    "tests/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "app/web/node_modules/",
    "app/web/dist/",
    "docs/mockups/",
    "**/__pycache__/",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running (NEURON threshold searches, FEM solves); excluded from the fast suite",
    "neuron: requires the NEURON cable engine (install the 'cable' extra)",
    "fem: requires a FEM backend (install the 'fem' extra)",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
