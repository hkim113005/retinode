name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The fast suite needs core + dev + the store extra (h5py/pyarrow, for the
      # project store tests). NEURON tests run in the separate test-neuron job
      # below; FEM tests join later.
      - name: Sync (core + dev + store)
        run: uv sync --extra dev --extra store

      - name: Lint
        run: uv run ruff check .

      - name: Type-check engine
        run: uv run mypy engine

      - name: Test (fast suite)
        run: uv run pytest -m "not slow and not neuron"

  test-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # store extra too: pytest imports every test module during collection
      # (incl. tests/store, which import pyarrow/h5py) before the -m filter runs.
      - name: Sync (cable + dev + store)
        run: uv sync --extra cable --extra dev --extra store

      - name: Compile NEURON mechanisms
        run: cd engine/cable/mechanisms && uv run nrnivmodl .

      - name: NEURON tests
        run: uv run pytest -m neuron
