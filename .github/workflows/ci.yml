name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The fast suite needs core + dev + store (h5py/pyarrow) + app (dash/plotly,
      # for the dashboard tests). NEURON tests run in the separate test-neuron job
      # below; FEM tests join later.
      - name: Sync (core + dev + store + app)
        run: uv sync --extra dev --extra store --extra app

      - name: Lint
        run: uv run ruff check .

      - name: Type-check engine
        run: uv run mypy engine

      - name: Test (fast suite)
        run: uv run pytest -m "not slow and not neuron"

  test-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # store + app extras too: pytest imports every test module during collection
      # (incl. tests/store and tests/app) before the -m filter runs.
      - name: Sync (cable + dev + store + app)
        run: uv sync --extra cable --extra dev --extra store --extra app

      - name: Compile NEURON mechanisms
        run: cd engine/cable/mechanisms && uv run nrnivmodl .

      - name: NEURON tests
        run: uv run pytest -m neuron

  test-fem:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0} # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      # DOLFINx/gmsh ship no pip wheel; build the conda-forge env (the same
      # env/fem-environment.yml used locally on Apple Silicon) with micromamba.
      - name: Set up the FEM conda env (DOLFINx + gmsh)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env/fem-environment.yml
          cache-environment: true

      - name: Install the project into the env
        run: pip install -e . --no-deps

      # Scope to tests/field: every fem-marked test lives there, and this avoids
      # collecting the neuron/store/app suites, whose deps are not in this env.
      - name: FEM tests (DOLFINx Poisson gate + gmsh mesh)
        run: pytest tests/field -m fem
