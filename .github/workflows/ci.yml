name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The fast suite needs only the core + dev deps. Slow NEURON/FEM tests
      # (markers: slow, neuron, fem) get their own job when those layers land.
      - name: Sync (core + dev)
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type-check engine
        run: uv run mypy engine

      - name: Test (fast suite)
        run: uv run pytest -m "not slow"
