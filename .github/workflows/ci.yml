name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # The fast suite needs core + dev + store (h5py/pyarrow) + api (fastapi/httpx,
      # for the /compare tests). tests/app is numpy-only since the Dash UI retired.
      # NEURON tests run in the separate test-neuron job below; FEM tests join later.
      - name: Sync (core + dev + store + api)
        run: uv sync --extra dev --extra store --extra api

      - name: Lint
        run: uv run ruff check .

      - name: Type-check engine
        run: uv run mypy engine

      - name: Test (fast suite)
        # `not fem` too: README and CONTRIBUTING both document the fast suite as
        # excluding all three markers. It passed either way only because every
        # fem test importorskips dolfinx, and relying on that made the marker a lie.
        run: uv run pytest -m "not slow and not neuron and not fem"

  test-neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # store + api extras too: pytest imports every test module during collection
      # (incl. tests/store, tests/app, tests/api) before the -m filter runs.
      - name: Sync (cable + dev + store + api)
        run: uv sync --extra cable --extra dev --extra store --extra api

      - name: Compile NEURON mechanisms
        run: cd engine/cable/mechanisms && uv run nrnivmodl .

      - name: NEURON tests
        run: uv run pytest -m neuron

  test-fem:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0} # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      # DOLFINx/gmsh ship no pip wheel; build the conda-forge env (the same
      # env/fem-environment.yml used locally on Apple Silicon) with micromamba.
      - name: Set up the FEM conda env (DOLFINx + gmsh)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env/fem-environment.yml
          cache-environment: true

      - name: Install the project into the env
        run: pip install -e . --no-deps

      # Scope to tests/field: every fem-marked test lives there, and this avoids
      # collecting the neuron/store/app suites, whose deps are not in this env.
      - name: FEM tests (DOLFINx Poisson gate + gmsh mesh)
        run: pytest tests/field -m fem

  # The React client (Phase 7 S2). Node-only; no Python here. The API contract
  # reaches the client through the committed OpenAPI snapshot + generated TS types.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install
        run: npm ci

      # The generated types must match the committed OpenAPI snapshot; a stale
      # schema.d.ts (or openapi.json) fails here rather than drifting silently.
      - name: Types in sync with the contract
        run: |
          npm run gen:types
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run gen:types' and commit."
            git --no-pager diff -- src/api/schema.d.ts
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
